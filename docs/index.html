<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Music Visualizer</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }

    .player{
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1;
    }
    body {
      overflow: hidden;
      background-color: black;
      margin: 0px;
    }
  </style>
</head>

<body>
<div class = "player">
  <audio id="audio" src="FarAwayNevertel.mp3" controls></audio>
</div>

<script src="./index.js"></script>
<script>
  
  MusicVisualizer.init(document.getElementById("audio"), window, true);
  
</script>
<script>
  document.getElementById('load-button').addEventListener('click', function() {
      var fileInput = document.getElementById('file-input');
      var fileInputContainer = document.getElementById('file-input-container');
      var audioLeft = document.getElementById('audio-left');

      if (fileInput.files.length > 0) {
          var file = fileInput.files[0];
          var fileURL = URL.createObjectURL(file);

          audioLeft.src = fileURL;
      

          MusicVisualizer.init(document.getElementById("audio"), window, true);

          // Hide the file input and button
          fileInputContainer.style.display = 'none';
      }
  });
</script>
</body>
</html>
