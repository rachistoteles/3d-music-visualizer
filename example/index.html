<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Music Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: black;
            margin: 0px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .file-input-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        .input-group {
            margin-bottom: 10px;
        }

        audio {
            position: absolute;
            bottom: 20px;
            width: 300px;
        }
    </style>
</head>
<body>
    <div class="file-input-container" id="file-input-container">
        <div class="input-group">
            <input type="file" id="file-input" accept="audio/*">
            <button id="load-button">Load Song</button>
        </div>
    </div>
    <div class = "player">
        <audio id="audio" controls></audio>
      </div>

    <script src="../dist/index.js"></script>
    <script>
        document.getElementById('load-button').addEventListener('click', function() {
            var fileInput = document.getElementById('file-input');
            var fileInputContainer = document.getElementById('file-input-container');
            var audio = document.getElementById('audio');

            if (fileInput.files.length > 0) {
                var file = fileInput.files[0];
                var fileURL = URL.createObjectURL(file);

                audio.src = fileURL;

                MusicVisualizer.init(audio, document.getElementById("audio"));

                // Hide the file input and button
                fileInputContainer.style.display = 'none';
            }
        });
    </script>

</body>
</html>
