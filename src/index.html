<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Music Visualizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <style>
    .controls-container {
  display: block;
  width: 40%;
  position: center;
  justify-content: center;
  align-items: center;
  top: 60px; /* Adjusted to avoid overlap with toggle button */
  left: 20px;
  z-index: 1;
  background: rgba(255, 255, 255, 0.8);
  padding: 25px;
  border-radius: 5px;
  gap: 10px;
  border: 2px solid #007bff; /* Blue border for the controls container */
}
.controls {
  width: 100%;
  display: block;
  margin-bottom: 10px;
  
}
.player {
  width: 30%;
  display: block;
}

.toggle-container {
  position:block;
  top: 5px;
  right: 8%;
  z-index: 2;
  padding: 5px;
  border: 1px solid #007bff; /* Blue border for the toggle container */
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.8);
}
    .form-group {
      
      display: block;
      flex-direction: column;
      
    }
    .form-control, .form-control-file {
      width: 100%;
      background-color: aliceblue;
    }
    .btn-hide {
      display: block;
      width: 100%;
      margin-top: 1%;
    }
    .btn-start {
      display: block;
      width: 100%;
      margin-top: 1%;
    }
    
  </style>
</head>

<body>
  <div class="controls-container">
    <div class="controls" >
      <!-- Your form groups go here -->
      <div class="form-group">
        <label for="audioFile">Select Audio File:</label>
        <input type="file" class="form-control-file" id="audioFile" accept="audio/*" src="./media/bowdowniprevail.mp3">
      </div>
      <div class="form-group">
        <label for="backgroundColor">Include Background Color:</label>
        <select class="form-control" id="backgroundColor">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>
      <div class="form-group">
        <label for="inOrderObjects">In order objects</label>
        <select class="form-control" id="inOrderObjects">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>
      <div class="form-group">
        <label for="numModels">Number of Models:</label>
        <select class="form-control" id="numModels">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option selected value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option  value="custom">Other</option>
        </select>
        <input type="number" class="form-control mt-2" id="customNumModels" value="25" style="display: none;">
      </div>
      
      <div class="form-group">
        <label for="distanceBetween">Distance Between Models:</label>
        <input type="number" class="form-control" id="distanceBetween" value="4" step="0.1">
      </div>
      <div class="form-group">
        <label for="rotationSpeedOdd">Rotation Speed (Odd Models):</label>
        <input type="number" class="form-control" id="rotationSpeedOdd" value="1.2" step="0.1">
      </div>
      <div class="form-group">
        <label for="rotationSpeedEven">Rotation Speed (Even Models):</label>
        <input type="number" class="form-control" id="rotationSpeedEven" value="1.8" step="0.1">
      </div>
      <div class="form-group">
        <label for="presets">Presets:</label>
        <select class="form-control" id="presets">
          <option value="default">Select a preset</option>
          <option value="preset1">Preset 1</option>
          <option value="preset2">Preset 2</option>
          <option value="preset3">Preset 3</option>
          <option value="preset4">Preset 4</option>
          <option value="preset5">Preset 5</option>
          <option value="preset6">Preset 6</option>
          <option value="preset7">Preset 7</option>
          <option value="preset8">Preset 8</option>
        </select>
      </div>
      <div class="form-group">
        <label for="features">Features:</label>
        <select class="form-control" id="features">
          <option value="default">Select a preset</option>
          <option value="preset1">Moving Position</option>
          <option selected value="preset2">Moving Rotation</option>
          <option value="preset3">Inverted</option>
          <option value="preset4">Translating</option>
          <option value="preset5">Planes</option>
          <option value="preset6">Spheres</option>
          <option value="preset7">Polyhedron</option>
          <option value="preset8">Preset 8</option>
        </select>
      </div>
      <button class="btn btn-primary btn-start" id="startButton">Start Visualizer</button>
      <button class="btn btn-secondary btn-start" id="print-button">Print Camera Info</button>
    </div>
    <div class="player">
      <audio id="audio" controls></audio>
    </div>
    
  </div>
  <div class="toggle-container">
    <button class="btn btn-info" id="toggleFormButton">Hide Form</button>
  </div>
  
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
  <script src="index.js"></script>
  <script>
   
   window.addEventListener("load", () => {
  const audioElement = document.getElementById("audio");
  const fileInput = document.getElementById("audioFile");
  const startButton = document.getElementById("startButton");
  const backgroundColorSelect = document.getElementById("backgroundColor");
  const numModelsSelect = document.getElementById("numModels");
  const customNumModelsInput = document.getElementById("customNumModels");
  const distanceBetweenInput = document.getElementById("distanceBetween");
  const rotationSpeedOddInput = document.getElementById("rotationSpeedOdd");
  const rotationSpeedEvenInput = document.getElementById("rotationSpeedEven");
  const presetsSelect = document.getElementById("presets");
  const inOrderObjectsSelect = document.getElementById("inOrderObjects");
  const toggleButton = document.getElementById("toggleFormButton");
  const controlsContainer = document.querySelector(".controls-container");
  const features = document.getElementById("features");

  const presets = {
    preset1: {
      numModels: 2,
      distanceBetween: 10,
      rotationSpeedOdd: 1.2,
      rotationSpeedEven: 1.4
    },
    preset2: {
      numModels: 3,
      distanceBetween: 80,
      rotationSpeedOdd: 1.6,
      rotationSpeedEven: 1.1
    },
    preset3: {
      numModels: 5,
      distanceBetween: 60,
      rotationSpeedOdd: 2,
      rotationSpeedEven: 1.4
    },
    preset4: {
      numModels: 4,
      distanceBetween: 50,
      rotationSpeedOdd: 1.5,
      rotationSpeedEven: 1.7
    },
    preset5: {
      numModels: 6,
      distanceBetween: 30,
      rotationSpeedOdd: 1.8,
      rotationSpeedEven: 1.3
    },
    preset6: {
      numModels: 8,
      distanceBetween: 70,
      rotationSpeedOdd: 2.1,
      rotationSpeedEven: 1.9
    },
    preset7: {
      numModels: 10,
      distanceBetween: 40,
      rotationSpeedOdd: 1.9,
      rotationSpeedEven: 1.5
    },
    preset8: {
      numModels: 12,
      distanceBetween: 20,
      rotationSpeedOdd: 2.3,
      rotationSpeedEven: 2.0
    }
  };

  presetsSelect.addEventListener("change", () => {
    const selectedPreset = presets[presetsSelect.value];
    if (selectedPreset) {
      numModelsSelect.value = selectedPreset.numModels;
      distanceBetweenInput.value = selectedPreset.distanceBetween;
      rotationSpeedOddInput.value = selectedPreset.rotationSpeedOdd;
      rotationSpeedEvenInput.value = selectedPreset.rotationSpeedEven;
    }
  });
  numModelsSelect.addEventListener("change", () => {
    if (numModelsSelect.value === "custom") {
      customNumModelsInput.style.display = "block";
    } else {
      customNumModelsInput.style.display = "none";
    }
  });

  toggleButton.addEventListener("click", () => {
    if (controlsContainer.style.display === "none") {
      controlsContainer.style.display = "block";
      toggleButton.textContent = "Hide Form";
    } else {
      controlsContainer.style.display = "none";
      toggleButton.textContent = "Show Form";
    }
  });

  startButton.addEventListener("click", () => {
    const file = fileInput.files[0];
    const includeBackgroundColor = backgroundColorSelect.value === "true";
    const numModels = numModelsSelect.value === "custom" ? parseInt(customNumModelsInput.value, 10) : parseInt(numModelsSelect.value, 10);
    const distanceBetween = parseFloat(distanceBetweenInput.value);
    const rotationSpeedOdd = parseFloat(rotationSpeedOddInput.value);
    const rotationSpeedEven = parseFloat(rotationSpeedEvenInput.value);

    if (file) {
      const fileURL = URL.createObjectURL(file);
      audioElement.src = fileURL;
      audioElement.play();
      MusicVisualizer.init(
        audioElement,
        window,
        includeBackgroundColor,
        numModels,
        distanceBetween,
        rotationSpeedOdd,
        rotationSpeedEven,
        inOrderObjectsSelect,
        features
      );

      // Hide the form after starting the visualizer
      controlsContainer.style.display = "none";
      toggleButton.textContent = "Show Form";
    } else {
  
      audioElement.src = "./media/bowdowniprevail.mp3";
      audioElement.play();
      MusicVisualizer.init(
        audioElement,
        window,
        includeBackgroundColor,
        numModels,
        distanceBetween,
        rotationSpeedOdd,
        rotationSpeedEven,
        inOrderObjectsSelect,
        features
      );
      controlsContainer.style.display = "none";
      toggleButton.textContent = "Show Form";
    }
  });
});

  </script>
  <script >
    
  </script>
</body>
</html>
